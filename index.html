<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprende Python · de la primera línea al primer genoma</title>
<meta name="description" content="Curso interactivo de Python desde cero hasta bioinformática, con código que se ejecuta en el navegador.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0E1726">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="drawerBtn" class="icon-btn" aria-label="Abrir el explorador de módulos" aria-controls="explorer" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <a class="brand" href="#" onclick="goTo(0); return false;" aria-label="Ir a la portada">
      <svg viewBox="0 0 64 64" aria-hidden="true" class="brand-mark"><rect width="64" height="64" rx="15" class="bm-bg"/><path d="M27.2 17.5H36.8 M27.2 46.5H36.8" stroke="#F4B740" stroke-width="4.4"/><path d="M44 9C44 27 20 37 20 55" stroke="#3CCB8F" stroke-width="5.8"/><path d="M20 9C20 27 44 37 44 55" stroke="#5AA2FF" stroke-width="5.8"/></svg>
      <span>aprende-python</span>
    </a>
    <nav id="crumbs" aria-label="Ruta del módulo"></nav>
    <div class="top-actions">
      <button id="paletteBtn" class="search-btn" onclick="openPalette()">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3.5 3.5"/></svg>
        <span>Buscar módulo</span><kbd>Ctrl K</kbd>
      </button>
      <button id="themeBtn" class="icon-btn" onclick="toggleTheme()" aria-label="Cambiar entre tema oscuro y claro">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 0 0 13z" class="fill"/></svg>
      </button>
    </div>
    <div id="readProgress" aria-hidden="true"></div>
  </header>

  <aside id="explorer" aria-label="Explorador de módulos">
    <div class="ex-top">
      <div class="ex-title">
        <span>Explorador</span>
        <span id="progressText" class="ex-count"></span>
      </div>
      <div id="progressBar" role="progressbar" aria-label="Progreso del curso"><div id="progressFill"></div></div>
      <label class="filter">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14l-5 6v5l-4-2v-3z"/></svg>
        <input id="searchBox" placeholder="Filtrar módulos" autocomplete="off" aria-label="Filtrar módulos por nombre">
      </label>
    </div>
    <nav id="navList"></nav>
    <div class="ex-foot">
      <button id="exportBtn" class="ghost-btn" title="Descargar tu progreso como archivo .json">Exportar progreso</button>
      <button class="ghost-btn" onclick="document.getElementById('importInput').click()" title="Cargar un archivo de progreso">Importar</button>
      <input type="file" id="importInput" accept="application/json" hidden>
    </div>
  </aside>
  <div id="scrim" onclick="closeDrawer()"></div>

  <main id="pane" tabindex="-1">
    <div id="tabs" role="tablist"></div>
    <div id="main"></div>
  </main>

  <footer id="statusbar" aria-live="polite">
    <span class="sb-item"><span id="kernelDot" class="dot loading"></span><span id="pyStatus">Cargando Python…</span></span>
    <span class="sb-item sb-hide-sm">Pyodide 0.26 (Python 3.12)</span>
    <span class="sb-item" id="sbProgress"></span>
    <span class="sb-item sb-hide-sm" id="sbExec">0 celdas ejecutadas</span>
    <span class="sb-spacer"></span>
    <span class="sb-item sb-hide-sm"><kbd>Ctrl Enter</kbd> ejecutar</span>
    <span class="sb-item sb-hide-sm"><kbd>Ctrl K</kbd> buscar</span>
    <span class="sb-item sb-hide-sm"><kbd>Alt ←</kbd><kbd>Alt →</kbd> módulos</span>
  </footer>
</div>

<div id="palette" role="dialog" aria-modal="true" aria-label="Buscar módulo" hidden>
  <div class="pal-box">
    <div class="pal-input">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3.5 3.5"/></svg>
      <input id="palInput" placeholder="Escribe para buscar: pandas, regex, PDB…" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <ul id="palList" role="listbox"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="js/data/datasets.js"></script>
<script src="js/data/modules.js"></script>
<script src="js/data/modules-ciencia.js"></script>
<script src="js/data/modules-bio.js"></script>
<script src="js/data/modules-ml.js"></script>
<script src="js/data/modules-dl.js"></script>
<script src="js/data/mapas.js"></script>
<script src="js/pyRunner.js"></script>
<script src="js/progress.js"></script>
<script src="js/estudio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
