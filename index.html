<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprende Python desde cero — v1.3</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>🐍 Aprende Python</h1>
      <button id="themeBtn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
    </div>
    <p class="sub">v1.3 · Desde cero, con práctica real</p>
    <input id="searchBox" placeholder="🔍 Buscar módulo…">
    <div id="progressWrap">
      <span id="progressText">0 / 17 módulos</span>
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
    <p id="pyStatus">Cargando Python en el navegador…</p>
    <nav><ul id="navList"></ul></nav>
    <div class="sidefoot">
      <button id="exportBtn">⬇ Exportar</button>
      <button onclick="document.getElementById('importInput').click()">⬆ Importar</button>
      <input type="file" id="importInput" accept="application/json" style="display:none">
    </div>
  </aside>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
<script src="js/data/modules.js"></script>
<script src="js/pyRunner.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
</body>
</html>
